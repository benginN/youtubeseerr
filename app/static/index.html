<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youtubeseerr</title>
<style>
  :root { --bg: #1a1b26; --box: #23242f; --fg: #d5d6dd; --dim: #8a8d98; --accent: #f7768e; --green: #9ece6a; --red: #f7768e; --blue: #7aa2f7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 1.2rem; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  h1 small { color: var(--dim); font-weight: normal; font-size: 0.8rem; margin-left: 0.6rem; }
  .search { display: flex; gap: 0.6rem; margin-bottom: 0.4rem; }
  .search input { flex: 1; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid #3a3c4a; background: var(--box); color: var(--fg); font-size: 1rem; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search button { padding: 0.65rem 1.1rem; border-radius: 8px; border: none; background: var(--accent); color: #16161e; font-weight: 600; cursor: pointer; }
  .hint { color: var(--dim); font-size: 0.82rem; margin-bottom: 1.1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.8rem; }
  .card { background: var(--box); border-radius: 10px; overflow: hidden; }
  .card .thumbwrap { position: relative; aspect-ratio: 16/9; background: #16161e; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .dur { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.75); border-radius: 4px; padding: 0 5px; font-size: 0.78rem; }
  .card .get { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); border: none; color: var(--fg); border-radius: 6px; padding: 2px 9px; font-size: 1rem; cursor: pointer; }
  .card .get:hover { background: var(--accent); color: #16161e; }
  .card .get:disabled { cursor: default; }
  .card .info { padding: 0.5rem 0.7rem 0.65rem; }
  .card .name { font-weight: 600; font-size: 0.9rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.35em; }
  .card .sub { color: var(--dim); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.15rem; }
  h2 { font-size: 1rem; color: var(--dim); margin: 1.6rem 0 0.6rem; }
  .queue .row { display: flex; gap: 0.7rem; align-items: baseline; padding: 0.35rem 0; border-bottom: 1px solid #2a2c38; font-size: 0.9rem; }
  .queue .status { flex-shrink: 0; width: 7.5rem; }
  .queue .what { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue .when { color: var(--dim); font-size: 0.8rem; flex-shrink: 0; }
  .btn { border: none; background: #2f3140; color: var(--fg); border-radius: 8px; padding: 0.1rem 0.45rem; cursor: pointer; font-size: 0.85rem; flex-shrink: 0; }
  .btn:hover { background: var(--accent); color: #16161e; }
  .ok { color: var(--green); } .err { color: var(--red); } .busy { color: var(--blue); }
  .note { color: var(--dim); font-size: 0.85rem; }
  .toast { position: fixed; top: 1rem; right: 1rem; background: var(--box); border: 1px solid var(--accent); border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.9rem; display: none; max-width: 22rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📺 Youtubeseerr <small>ara ya da bağlantı yapıştır → Jellyfin'de görünür</small></h1>
  <form class="search" id="searchForm">
    <input id="searchBox" type="search" placeholder="YouTube'da ara… ya da video/oynatma listesi bağlantısı yapıştır" autofocus>
    <button type="submit">Ara / İndir</button>
  </form>
  <div class="hint">Bağlantı yapıştırırsan doğrudan indirme kuyruğuna girer (oynatma listeleri de olur); yazı yazarsan YouTube'da arar.</div>
  <div id="results"><div class="note">Aramak için yukarıya yaz; sonuçlar burada çıkar.</div></div>
  <h2>Kuyruk &amp; son indirilenler</h2>
  <div class="queue" id="queue"><div class="note">—</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const resultsEl = document.getElementById("results");
const queueEl = document.getElementById("queue");
const toastEl = document.getElementById("toast");
const STATUS_TEXT = {
  "queued": ["⏳ sırada", "busy"], "downloading": ["⬇️ iniyor", "busy"],
  "done": ["✅ indi", "ok"], "exists": ["✔ zaten var", "ok"], "error": ["⚠️ hata", "err"],
};

function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function fmtDur(sec) {
  if (!sec) return "";
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function toast(m) {
  toastEl.textContent = m; toastEl.style.display = "block";
  clearTimeout(toastEl._t); toastEl._t = setTimeout(() => toastEl.style.display = "none", 7000);
}

function drawVideos(el, results) {
  if (!results.length) { el.innerHTML = '<div class="note">Sonuç yok.</div>'; return; }
  el.innerHTML = '<div class="grid">' + results.map(v => `
    <div class="card">
      <div class="thumbwrap">
        <img src="/api/thumb?v=${v.video_id}" alt="" loading="lazy">
        ${v.duration ? `<div class="dur">${fmtDur(v.duration)}</div>` : ""}
        ${v.exists ? '<button class="get" disabled title="Zaten indirilmiş">✔</button>'
                   : `<button class="get" data-id="${v.video_id}" title="İndir → Jellyfin">⬇</button>`}
      </div>
      <div class="info">
        <div class="name" title="${esc(v.title)}">${esc(v.title)}</div>
        <div class="sub" title="${esc(v.channel)}">${esc(v.channel)}</div>
      </div>
    </div>`).join("") + "</div>";
  el.querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => downloadOne(b)));
}

async function downloadOne(btn) {
  btn.disabled = true; btn.textContent = "⏳";
  try {
    const r = await fetch("/api/download", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_id: btn.dataset.id }) });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (d.status === "exists") { btn.textContent = "✔"; return; }
    watch(d.job_id, btn);
  } catch { btn.textContent = "⚠️"; btn.disabled = false; }
  refreshQueue();
}

function watch(jobId, btn) {
  const timer = setInterval(async () => {
    try {
      const d = await (await fetch("/api/job/" + jobId)).json();
      if (d.status === "done" || d.status === "exists") { btn.textContent = "✅"; clearInterval(timer); refreshQueue(); }
      else if (d.status === "error") { btn.textContent = "⚠️"; btn.title = d.error || "hata"; clearInterval(timer); refreshQueue(); }
    } catch {}
  }, 5000);
  setTimeout(() => clearInterval(timer), 60 * 60 * 1000);
}

async function downloadUrl(url) {
  resultsEl.innerHTML = '<div class="note">⏳ bağlantı çözülüyor… (oynatma listelerinde biraz sürebilir)</div>';
  try {
    const r = await fetch("/api/download", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }) });
    if (!r.ok) throw new Error((await r.json()).detail || "bağlantı çözülemedi");
    const d = await r.json();
    if (d.status === "exists") { toast("✔ Bu video zaten indirilmiş."); resultsEl.innerHTML = ""; }
    else if (d.kind === "playlist")
      toast(`📃 ${d.playlist || "Liste"}: ${d.added} video kuyruğa girdi` + (d.skipped ? `, ${d.skipped} zaten vardı/sıradaydı` : ""));
    else if (d.added !== undefined)
      toast(d.added ? "⬇ Video kuyruğa girdi." : "✔ Zaten indirilmiş ya da sırada.");
    else toast("⬇ Video kuyruğa girdi.");
    resultsEl.innerHTML = '<div class="note">Kuyruk aşağıda ilerliyor.</div>';
  } catch (err) { resultsEl.innerHTML = '<div class="note err">⚠️ ' + esc(err.message || "bağlantı çözülemedi") + "</div>"; }
  refreshQueue();
}

async function refreshQueue() {
  try {
    const d = await (await fetch("/api/queue")).json();
    if (!d.jobs.length) { queueEl.innerHTML = '<div class="note">Henüz bir şey indirilmedi.</div>'; return; }
    queueEl.innerHTML = (d.pending > 0 ? `<div class="note busy" style="padding:0.3rem 0;">⏳ sırada ${d.pending} video var</div>` : "") +
      d.jobs.map(j => {
        const [m, cls] = STATUS_TEXT[j.status] || [j.status, ""];
        return `<div class="row"><div class="status ${cls}">${m}</div>
          <div class="what" title="${esc(j.error || "")}">${esc(j.title || j.video_id)} <span class="note">${esc(j.channel || "")}</span></div>
          ${j.status === "error" ? `<button class="btn" data-retry="${j.id}" title="${esc(j.error || "")} — yeniden dene">🔁</button>` : ""}
          <div class="when">${esc((j.finished || j.added || "").slice(5, 16))}</div></div>`;
      }).join("");
    queueEl.querySelectorAll("button[data-retry]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "⏳";
      try { await fetch("/api/retry/" + b.dataset.retry, { method: "POST" }); } catch {}
      setTimeout(refreshQueue, 800);
    }));
    if (d.pending > 0) setTimeout(refreshQueue, 5000);
  } catch { queueEl.innerHTML = '<div class="note err">Kuyruk okunamadı.</div>'; }
}

document.getElementById("searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("searchBox").value.trim();
  if (!q) return;
  if (/^https?:\/\//i.test(q)) { downloadUrl(q); return; }
  resultsEl.innerHTML = '<div class="note">⏳ YouTube\'da aranıyor…</div>';
  try {
    drawVideos(resultsEl, (await (await fetch("/api/search?q=" + encodeURIComponent(q))).json()).results);
  } catch { resultsEl.innerHTML = '<div class="note err">Arama başarısız — YouTube\'a ulaşılamadı.</div>'; }
});

refreshQueue();
</script>
</body>
</html>
